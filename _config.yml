          "https://orcid.org/0009-0003-9210-0999",
          "https://github.com/Girish-K01",
          "https://www.linkedin.com/in/girish-kulathumani/",
          "https://arxiv.org/a/kulathumani_g_1.html",
          "https://greylattice.substack.com",
          "https://twitter.com/GK4913",
          "https://www.kaggle.com/girishk49"
         ]


# Analytics: off. Two options are wired up:
#   GoatCounter (free, privacy-friendly, no cookie banner): create a site at goatcounter.com, then
#     provider: "goatcounter"   and   goatcounter_code: "<your code>"  (the part before .goatcounter.com)
#   Google Analytics 4: provider: "google-analytics-4"  and  google: { tracking_id: "G-XXXXXXXXXX" }
#     (the previous tag G-PZ8254RK67 returned 404 from Google)
analytics:
  provider: false
  goatcounter_code:


# Reading Files
include:
  - _pages
  - files
exclude:
  - .bundle
  - .github
  - .jekyll-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - scripts
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - local
  - node_modules
  - package.json
  - pnpm-lock.yaml
  - README.md
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# These settings control the types of collections used by the template
collections:
  publications:
    output: true
    permalink: /:collection/:path/  


# These settings control how pages and collections are included in the site.
# Every page uses one centred column (no sidebar, share buttons or related posts).
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # http://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style
  sourcemap: never
  # The template SCSS predates Dart Sass and uses @import, slash division, etc.
  # These are warnings today but will be errors in Dart Sass 3.0; the lockfile pins
  # sass-embedded 1.x. Remove an entry here to see where it is used.
  quiet_deps: true
  silence_deprecations:
    - import
    - global-builtin
    - slash-div
    - if-function
    - color-functions


# Outputting
permalink: /:categories/:title/
timezone: Etc/UTC # http://en.wikipedia.org/wiki/List_of_tz_database_time_zones


# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

#Archives
tag_archive:
  type: liquid
  path: /tags/

# HTML Compression
# - http://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development
