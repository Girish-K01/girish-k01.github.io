# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve -l -H localhost`. If you change this file, please restart the 
# server process.

# Basic Site Settings
locale                   : "en-US"
site_theme               : "default"
title                    : "Girish Kulathumani"
title_separator          : "–"
tagline                  : "EEG/EMG decoding and federated learning" # home page <title>
name                     : &name "Girish Kulathumani"
description              : &description "Girish Kulathumani works on decoding non-invasive biosignals (EEG and wrist EMG), federated learning and leakage-free evaluation."
url                      : "https://girish-k01.github.io"
baseurl                  : ""
repository               : "Girish-K01/girish-k01.github.io"

# Site Author - used by the home page (photo, email, profile links), the footer links on every page
#               (_includes/footer.html) and the SEO tags. A blank link is simply left out.
