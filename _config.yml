  avatar           : "profile_pic.webp"
  name             : "Girish Kulathumani"
  pronouns         : # example: "she/her"  
  bio              : "Biosignal decoding · Federated learning"
  location         : "Chennai, Tamil Nadu, India"
  employer         : # not shown anywhere at the moment (VIT ended May 2025, Accenture Oct 2026)
  uri              : # URL
  email            : "girish.kulathumani@gmail.com" 

  # Academic websites
  arxiv            : "https://arxiv.org/a/kulathumani_g_1.html"
  googlescholar    : "https://scholar.google.com/citations?user=hOmai0UAAAAJ&hl=en"
  impactstory      : # URL
  orcid            : "https://orcid.org/0009-0003-9210-0999"
  semantic         : # URL
  pubmed           : # URL
  researchgate     : # URL
  scopus           : # URL

  # Repositories and software development
  bitbucket        : # Username - Update with your username on the site
  codepen          : # Username
  dribbble         : # Username
  github           : "Girish-K01" # Username - Update with your username on the site
  kaggle           : "girishk49"  
  stackoverflow    : # User number or user number and name (i.e., use "1" or "1/jeff-atwood")    

  # Social media
  bluesky          : # Username
  facebook         : # Username
  flickr           : # Username
  foursquare       : # Username
  goodreads        : # Username
  google_plus      : # Username
  keybase          : # Username
