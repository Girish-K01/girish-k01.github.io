  name                   : Girish Kulathumani
  alumni_of              : "Vellore Institute of Technology, Chennai"
  knows_about            : ["EEG decoding", "Surface electromyography (EMG)", "Brain-computer interfaces", "Federated learning", "Machine learning"]
