# Publication categories: a paper's `category` is one of these keys, and `title` is the label shown
# after its venue (/publications/ is one list, newest first, so an unknown category only loses the label)
publication_category:
  manuscripts:
    title: 'Journal article'
  conferences:
    title: 'Conference paper'

# Site Settings
teaser                   :  # filename of fallback teaser image placed in /images/
breadcrumbs              : false # true, false (default)
words_per_minute         : 160
future                   : true
read_more                : "disabled" # if enabled, adds "Read more" links to excerpts
atom_feed:
  hide                   : false     # change to true to hide the RSS feed in the footer
  path                   : # blank (default) uses feed.xml


# SEO Related
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :


# Social Sharing
twitter:
  username               : &twitter "GK4913"
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 : "og-card.png" # 1200x630 link preview; regenerate with scripts/brand_images.py
# Structured data describing you (schema.org Person, on the home page).
# sameAs links help search engines connect your profiles to this site.
